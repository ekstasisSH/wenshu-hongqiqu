/* ===== 全局 state ===== */
const state = {
  currentIndex: 0,   // 0-6
  grade: '大学',
  tab: 'event',      // event | theory | history
};


/* ===== 学段切换（I4） ===== */
function setGrade(g) {
  state.grade = g;
  document.querySelector('.app').setAttribute('data-grade', g);
  document.querySelectorAll('.grade-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.grade === g);
  });
  // 若弹层开着，刷新（事件详情文本按学段换）
  if ($('#detail-panel').classList.contains('open')) renderDetail();
}
/* ===== 工具 ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);

const PHASE_CHIP = { practice:'实践', recognition:'认识', repractice:'再实践' };

/* ===== 渲染：时间轴（I1） ===== */
function renderTimeline() {
  const tl = $('#timeline');
  tl.innerHTML = '';
  DATA.points.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tl__node' + (i === state.currentIndex ? ' active' : '');
    btn.setAttribute('aria-label', '节点' + (i+1) + ' ' + p.title);
    btn.innerHTML = `<span class="tl__dot"></span><span class="tl__year">${esc(p.year)}</span>`;
    btn.addEventListener('click', () => openDetail(i));
    tl.appendChild(btn);
  });
}

/* ===== 渲染：左栏 stepper ===== */
function renderStepper() {
  const list = $('#stepper-list');
  list.innerHTML = '';
  DATA.points.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'stepper__node' + (i === state.currentIndex ? ' active' : '');
    btn.innerHTML = `<span class="dot"></span><span><span class="label">${esc(p.title)}</span><br><span class="phase">${esc(p.phase_set)}</span></span>`;
    btn.addEventListener('click', () => openDetail(i));
    list.appendChild(btn);
  });
}

/* ===== 选择节点（全同步：时间轴/stepper/弹层） ===== */
function selectNode(i) {
  state.currentIndex = i;
  renderTimeline();
  renderStepper();
  applyChannel(i);  // 渠线演进（在线/离线）
  updateStageImg();  // 右栏图片钩子（待定图后渲染）
}
/* 右栏图片钩子：当前阶段占位（将来填图） */
function updateStageImg() {
  const ph = document.getElementById('stage-img-placeholder');
  if (!ph) return;
  const p = DATA.points[state.currentIndex];
  ph.textContent = p.year + ' · ' + p.title + '（图示待定）';
}


/* ===== Phase 3 地图模块：在线天地图 + 离线 SVG + 双重判定降级 ===== */
let mapInstance = null;
let mapMarkers = [];
let mapLine = null;
let mapMode = 'loading';   // loading | online | svg

/* 渠线 Polyline：7 节点 geo 连线 */
function buildPolylinePoints() {
  // 渠线随节点演进：只画到当前节点（含）为止，点下一节点续长
  return DATA.points.slice(0, state.currentIndex + 1).map(p => new T.LngLat(p.geo.lng, p.geo.lat));
}

/* 在线天地图初始化 */
function initOnlineMap() {
  const center = DATA.map.center;
  const map = new T.Map('tianditu', {
    center: new T.LngLat(center[1], center[0]),  // map.center 为 [lat,lng]，转序
    zoom: DATA.map.zoom,
    layers: [new T.TileLayer('vec')]             // 矢量底图
  });
  mapInstance = map;
  mapMode = 'online';
  // Marker（白描边）+ Polyline
  mapMarkers = DATA.points.map((p, i) => {
    const m = new T.Marker(new T.LngLat(p.geo.lng, p.geo.lat), { icon: markerIcon(i) });
    m.on('click', () => openDetail(i));
    map.addOverLay(m);
    return m;
  });
  mapLine = new T.Polyline(buildPolylinePoints(), {
    color: '#C81623', weight: 4, opacity: 0.9
  });
  map.addOverLay(mapLine);
  // 联动：当前节点高亮
  highlightMapNode(state.currentIndex);
}

/* Marker 图标：白描边红点 */
function markerIcon(i) {
  const active = i === state.currentIndex;
  return new T.Icon({
    iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="7" fill="${active?'#C81623':'#FFFFFF'}" stroke="#FFFFFF" stroke-width="2"/></svg>`
    ),
    iconSize: new T.Point(18, 18)
  });
}

/* 地图联动：高亮当前节点 Marker + panTo 居中（3b） */
function highlightMapNode(i) {
  if (!mapInstance || mapMode !== 'online') return;
  const p = DATA.points[i];
  mapMarkers.forEach((m, idx) => m.setIcon(markerIcon(idx)));
  // panTo 居中到当前节点
  mapInstance.panTo(new T.LngLat(p.geo.lng, p.geo.lat));
  setPolylineForNode(i);  // 渠线演进到当前节点 + 闪两次
  mapInstance.setZoom(Math.max(mapInstance.getZoom(), 11));
}


/* 渠线随节点演进 + 闪两次高亮（在线） */
function setPolylineForNode(i) {
  if (!mapInstance || mapMode !== 'online' || !mapLine) return;
  try {
    mapLine.setPath(buildPolylinePoints());  // 更新到当前节点
    // 闪两次高亮续长段
    const last = DATA.points[i];
    const hl = new T.Polyline([new T.LngLat(last.geo.lng, last.geo.lat), new T.LngLat(last.geo.lng, last.geo.lat)], {
      color: '#D4A017', weight: 8, opacity: 1
    });
    map.addOverLay(hl);
    let k = 0;
    const flash = setInterval(() => {
      k++;
      hl.setOpacity(k % 2 === 1 ? 1 : 0.2);
      if (k >= 4) { clearInterval(flash); map.removeOverLay(hl); }  // 闪两次(4半周期)
    }, 250);
  } catch(e) {}
}
/* 离线可交互 SVG（3c）：渠线 + 7 可点 Marker，共用同一 state */
let svgEl = null;
function buildOfflineSvg() {
  const stage = document.querySelector('#tianditu');
  if (mapInstance) { try { mapInstance.clearOverLays(); } catch(e){} mapInstance = null; }
  mapMarkers = []; mapLine = null;
  stage.innerHTML = '';
  mapMode = 'svg';
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 400 300');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.style.background = '#FBF7F0';
  // 全部 7 点（Marker 用）+ 渠线只画到当前节点（演进）
  const allPts = DATA.points.map(p => projXY(p.geo.lng, p.geo.lat));
  const pts = allPts.slice(0, state.currentIndex + 1);  // 渠线演进
  const line = document.createElementNS(svgNS, 'polyline');
  line.setAttribute('points', pts.map(pt => pt.x + ',' + pt.y).join(' '));
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', '#C81623');
  line.setAttribute('stroke-width', '3');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(line);
  // 续长段闪两次高亮（最后一段）
  if (pts.length >= 2) {
    const last = pts[pts.length - 2];
    const cur = pts[pts.length - 1];
    const flashSeg = document.createElementNS(svgNS, 'line');
    flashSeg.setAttribute('x1', last.x); flashSeg.setAttribute('y1', last.y);
    flashSeg.setAttribute('x2', cur.x); flashSeg.setAttribute('y2', cur.y);
    flashSeg.setAttribute('stroke', '#D4A017');
    flashSeg.setAttribute('stroke-width', '6');
    flashSeg.setAttribute('stroke-linecap', 'round');
    flashSeg.classList.add('seg-flash');
    svg.appendChild(flashSeg);
  }
  // 7 可点 Marker（复用 openDetail）
  DATA.points.forEach((p, i) => {
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', allPts[i].x); c.setAttribute('cy', allPts[i].y);
    c.setAttribute('r', '7');
    c.setAttribute('fill', '#FFFFFF');
    c.setAttribute('stroke', '#C81623');
    c.setAttribute('stroke-width', '2');
    c.style.cursor = 'pointer';
    c.addEventListener('click', () => openDetail(i));
    svg.appendChild(c);
  });
  stage.appendChild(svg);
  svgEl = svg;
}

/* 地理坐标 → SVG 平面投影（简化，仅示意渠线走向） */
function projXY(lng, lat) {
  const bounds = { lngMin: 113.74, lngMax: 113.84, latMin: 36.19, latMax: 36.37 };
  const x = (lng - bounds.lngMin) / (bounds.lngMax - bounds.lngMin) * 360 + 20;
  const y = (bounds.latMax - lat) / (bounds.latMax - bounds.latMin) * 260 + 20;
  return { x, y };
}

/* 双重判定降级（3c）：对象失败立即降级；创建成功但 5s 无瓦片也降级 */
function initMap() {
  mapMode = 'loading';
  try {
    if (typeof T === 'undefined' || !T.Map) throw new Error('天地图API未加载');
    initOnlineMap();
    // 5s 后检查瓦片是否铺上
    setTimeout(() => {
      // 检测地图瓦片容器内的真实瓦片（排除 logo 等非瓦片 img）
      const tilePane = document.querySelector('#tianditu .tdt-tile-pane');
      // 只数"真正加载成功"的瓦片（complete 且 naturalWidth>0），abort/失败残留的 img 不算
      const tileCount = tilePane ? Array.from(tilePane.querySelectorAll('img')).filter(i => i.complete && i.naturalWidth > 0).length : 0;
      if (mapMode === 'online' && tileCount === 0) {
        console.warn('天地图 5s 无瓦片，降级离线 SVG');
        buildOfflineSvg();
      }
    }, 5000);
  } catch (e) {
    console.warn('天地图初始化失败，降级离线 SVG:', e.message);
    buildOfflineSvg();
  }
}

/* ===== 详情弹层（I2 单弹层 + 三 Tab） ===== */
/* 渠线演进（在线/离线） */
function applyChannel(i) {
  if (mapMode === 'online') highlightMapNode(i);       // 在线：Marker高亮+panTo+渠线演进
  else if (mapMode === 'svg') buildOfflineSvg();       // 离线：重建渠线（随节点演进）
}

function openDetail(i) {
  state.currentIndex = i;
  state.tab = 'event';
  renderTimeline(); renderStepper(); applyChannel(i); updateStageImg(); renderDetail();
  $('#detail-panel').classList.add('open');
  $('#detail-close').focus();
}

function closeDetail() {
  $('#detail-panel').classList.remove('open');
  // 焦点返回时间轴当前节点
  $('#timeline .tl__node.active')?.focus();
}

function renderTabs() {
  const tabs = $('#detail-tabs');
  tabs.innerHTML = '';
  // 小学档隐藏两个溯源 Tab（theme_token §6：极简，藏溯源层）
  const isPrimary = state.grade === '小学';
  const defs = [['event','事件详情'],['theory','理论溯源'],['history','史实溯源']]
    .filter(([k]) => !(isPrimary && k !== 'event'));
  defs.forEach(([key,label]) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', state.tab === key);
    b.textContent = label;
    b.addEventListener('click', () => { state.tab = key; renderTabs(); renderDetail(); });
    tabs.appendChild(b);
  });
}

/* ===== 渲染详情正文（含 node7 谱系遍历） ===== */
function renderDetail() {
  const p = DATA.points[state.currentIndex];
  const body = $('#detail-body');
  $('#detail-title').textContent = (state.currentIndex+1) + '. ' + p.title;
  $('#detail-meta').textContent = p.year + ' ｜ ' + p.phase_set + ' ｜ 学段：' + state.grade;
  renderTabs();

  let h = '';
  if (state.tab === 'event') {
    // 学段切换：事件详情正文按 grade 字段换文本（theme_token §6）
    if (state.grade === '小学') {
      h += `<div class="block"><p>${esc(p.grade && p.grade['小学'] || p.practice)}</p></div>`;
    } else {
      h += `<div class="block"><h4><span class="practice-chip">实践</span></h4><p>${esc(p.grade && p.grade[state.grade] || p.practice)}</p></div>`;
      h += `<div class="block"><h4><span class="cognition-chip">认识</span></h4><p>${esc(p.recognition)}</p></div>`;
      h += `<div class="block"><h4><span class="repractice-chip">再实践</span></h4><p>${esc(p.repractice)}</p></div>`;
      h += `<div class="block"><p class="keydata">关键数据：${esc(p.key_data)}</p></div>`;
    }
  } else if (state.tab === 'theory') {
    // node7 谱系：检测 anch_auxiliary / anch_contemporary
    const anc = p.anch || {};
    h += `<div class="block"><h4>毛选理论溯源</h4>`;
    h += `<div class="anch-src">${esc(anc.src)} ｜ ${esc(anc.vol)} ｜ 第 ${esc(anc.page)} 页</div>`;
    h += `<div class="anch-excerpt">“${esc(anc.excerpt)}”</div>`;
    h += `<div class="anch-edition">版次：${esc(anc.edition || '待核')}</div>`;
    h += `</div>`;
    // 辅助锚点（node7 有）
    if (p.anch_auxiliary && p.anch_auxiliary.length) {
      h += `<div class="block"><h4>辅助锚点</h4>`;
      p.anch_auxiliary.forEach(a => {
        h += `<div class="aux-block"><h5>${esc(a.src)}</h5><div class="anch-src">${esc(a.vol)} ｜ 第 ${esc(a.page)} 页</div><div class="anch-excerpt">“${esc(a.excerpt)}”</div></div>`;
      });
      h += `</div>`;
    }
    // 当代印证（node7 有）
    if (p.anch_contemporary) {
      const c = p.anch_contemporary;
      h += `<div class="block"><h4>当代印证</h4><div class="contemp-block"><h5>${esc(c.src)}</h5><p>${esc(c.excerpt)}</p><div class="note-mark">※ ${esc(c.note || '非《毛选》原文')}</div></div></div>`;
    }
  } else if (state.tab === 'history') {
    h += `<div class="block"><h4>史实溯源（新闻报道）</h4>`;
    (p.source || []).forEach(s => {
      h += `<div class="block"><div>${esc(s.title)}</div><a class="src-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>`;
    });
    h += `</div>`;
  }
  body.innerHTML = h;
}

/* ===== 键盘导航（←/→ 切节点） ===== */
document.addEventListener('keydown', (e) => {
  const detailOpen = $('#detail-panel').classList.contains('open');
  if (e.key === 'ArrowRight') { openDetail(Math.min(state.currentIndex+1, 6)); }
  else if (e.key === 'ArrowLeft') { openDetail(Math.max(state.currentIndex-1, 0)); }
  else if (e.key === 'Escape' && detailOpen) { closeDetail(); }
});

/* ===== 初始化 ===== */
$('#detail-close').addEventListener('click', closeDetail);
document.querySelectorAll('.grade-btn').forEach(b => {
  b.addEventListener('click', () => setGrade(b.dataset.grade));
});
// 延迟到天地图 API 完全就绪再初始化（避免 extend 时序错误）
setTimeout(() => {
  if (typeof T !== 'undefined' && T.Map) initMap();
  else { console.warn('天地图API未就绪，直接降级离线SVG'); buildOfflineSvg(); }
}, 300);
renderTimeline(); renderStepper();
window.__SKELETON_READY__ = DATA.points.length === 7;
</script>
</body>
</html>
