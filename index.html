<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文枢·星课 · 红旗渠——实践·认识·再实践</title>

<style>
/* ===== theme_token.md 全套 CSS 变量（Kimi 撰写视觉基准） ===== */
:root {
  --primary: #C81623; --primary-deep: #8E0F18; --accent: #D4A017;
  --bg: #FBF7F0; --panel: #FFFFFF; --ink: #2B2B2B; --ink-sub: #6B6B6B;
  --line: #E3DAC8; --water: #2E6FA3;
  --practice: #C81623; --cognition: #D4A017; --repractice: #7A1F1F;
  --radius: 10px; --radius-sm: 6px;
  --font-title: "Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --font-body: -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font-family:var(--font-body); background:var(--bg); color:var(--ink); font-size:16px; -webkit-font-smoothing:antialiased; }

/* ===== 栅格：CSS Grid + 移动优先 ===== */
.app { display:flex; flex-direction:column; min-height:100vh; }
.app > .main { flex:1; min-height:0; }
.app__head {
  flex:0 0 auto;  /* 不拉伸 */
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:10px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.app__head h1 { font-family:var(--font-title); font-weight:700; font-size:20px; color:var(--primary-deep); }
.app__head .sub { font-size:12px; color:var(--ink-sub); }
.app__head .grade-switch { margin-left:auto; }
.main { display:grid; grid-template-columns:1fr; min-height:0; }
.stepper { background:var(--panel); border-bottom:1px solid var(--line); padding:14px; overflow-y:auto; }
.map-stage { position:relative; min-height:42vh; background:var(--bg); border-bottom:1px solid var(--line); }
.map-stage__map { position:absolute; inset:0; }
.timeline-bar { flex:0 0 auto; position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 12px; z-index:20; }

@media (min-width:768px) {
  .main { grid-template-columns:40% 60%; }
  .stepper { border-bottom:none; border-right:1px solid var(--line); min-height:0; }
  .map-stage { min-height:0; border-bottom:none; }
  .timeline-bar { position:static; }
}
@media (min-width:1280px) {
  .main { grid-template-columns:40% 60%; }  /* 左四右六 */
  .stepper { border-right:1px solid var(--line); }

}



/* ===== 节点图片小弹窗 ===== */
.img-pop {
  position:fixed; left:620px; bottom:64px; z-index:1500;  /* 地图栏内左下方（避开左栏边界，留60px间距） */
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(43,43,43,.14); padding:16px; width:400px;  /* 放大 */
  display:none;
}
.img-pop.open { display:block; }
.img-pop__title { font-size:15px; font-weight:700; color:var(--primary-deep); margin-bottom:10px; }
.img-pop__frame {
  width:100%; height:240px; background:var(--bg); border:1px dashed var(--line);
  border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
  color:var(--ink-sub); font-size:13px; overflow:hidden;
}
.img-pop__frame img { width:100%; height:100%; object-fit:cover; }
.img-pop__close {
  position:absolute; top:6px; right:6px; background:var(--panel); border:1px solid var(--line);
  border-radius:50%; width:22px; height:22px; cursor:pointer; line-height:1; color:var(--ink);
}

/* ===== 离线底图 Marker ===== */
.offline-map { overflow:hidden; position:absolute; inset:0; }
.off-marker {
  position:absolute; transform:translate(-50%,-50%);
  background:none; border:none; cursor:pointer; padding:0;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.off-dot {
  width:14px; height:14px; border-radius:50%;
  background:#FFFFFF; border:2px solid var(--primary);
  box-shadow:0 0 0 2px rgba(251,247,240,.7);
  transition:all .3s ease-out;
}
.off-marker.active .off-dot { background:var(--primary); transform:scale(1.2); }
.off-label {
  font-size:11px; color:var(--ink); background:rgba(251,247,240,.85);
  padding:1px 5px; border-radius:3px; white-space:nowrap; font-weight:600;
}
.off-marker.active .off-label { color:var(--primary-deep); }
.off-marker:focus-visible .off-dot { outline:2px solid var(--accent); outline-offset:2px; }

/* ===== 恢复的样式（此前误删） ===== */
.stepper__title { font-family:var(--font-title); font-weight:600; font-size:15px; color:var(--primary-deep); margin-bottom:10px; }
.stepper__list { display:flex; flex-direction:column; gap:6px; }
.stepper__node { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm); cursor:pointer; border:1px solid transparent; background:none; width:100%; text-align:left; }
.stepper__node:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.dot { width:10px; height:10px; border-radius:50%; border:2px solid var(--line); background:var(--panel); flex-shrink:0; }
.dot { background:var(--primary); border-color:var(--primary-deep); }
.label { font-size:13px; color:var(--ink); }
.label { color:var(--primary-deep); font-weight:700; }
.phase { font-size:11px; color:var(--ink-sub); }
.detail__head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.detail__title { font-family:var(--font-title); font-size:20px; font-weight:700; color:var(--primary-deep); }
.detail__meta { font-size:12px; color:var(--ink-sub); margin-top:4px; }
.detail__close { background:none; border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; font-size:14px; color:var(--ink); }
.detail__close:focus-visible { outline:2px solid var(--accent); }
.tabs { display:flex; gap:6px; border-bottom:2px solid var(--line); margin-bottom:14px; }
.tab { background:none; border:none; padding:8px 14px; font-size:14px; color:var(--ink-sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; }
.tab[aria-selected="true"] { color:var(--primary-deep); font-weight:700; border-bottom-color:var(--primary); }
.tab:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.detail__body { font-size:14px; line-height:1.7; color:var(--ink); }
.detail__body { font-size: var(--body-size, 16px); }
.block { margin-bottom:16px; }
.block h4 { font-size:14px; font-weight:700; color:var(--primary-deep); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.practice-chip { border:1px solid var(--practice); color:var(--practice); border-radius:4px; padding:0 6px; font-size:11px; }
.cognition-chip { border:1px solid var(--cognition); color:var(--primary-deep); border-radius:4px; padding:0 6px; font-size:11px; }
.repractice-chip { border:1px solid var(--repractice); color:var(--repractice); border-radius:4px; padding:0 6px; font-size:11px; }
.keydata { border-left:3px solid var(--accent); padding-left:10px; color:var(--primary-deep); font-weight:600; }
.anch-src { font-size:13px; color:var(--ink-sub); margin-top:4px; }
.anch-excerpt { font-style:italic; color:var(--ink); border-left:3px solid var(--line); padding-left:10px; margin-top:6px; }
.anch-edition { font-size:11px; color:var(--ink-sub); margin-top:4px; }
.src-link { display:block; font-size:13px; color:var(--water); margin-top:4px; text-decoration:underline; }
.contemp-block { border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; margin-top:8px; }
.contemp-block h5 { font-size:13px; color:var(--accent); margin-bottom:4px; }
.note-mark { font-size:11px; color:var(--ink-sub); }
.grade-switch { display:flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px; }
.grade-btn { background:none; border:none; padding:5px 12px; font-size:13px; color:var(--ink-sub); cursor:pointer; border-radius:4px; }
.grade-btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.seg-flash { animation: segflash 1s ease-in-out 2; }
.tl { display:flex; align-items:center; gap:2px; }
.tl__node { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; background:none; border:none; cursor:pointer; }
.tl__dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--panel); transition:all .3s ease-out; }
.tl__year { font-size:11px; color:var(--ink-sub); }
.tl__dot { background:var(--primary); border-color:var(--primary-deep); transform:scale(1.2); }
.tl__year { color:var(--primary-deep); font-weight:700; }
.tl__dot { outline:2px solid var(--accent); outline-offset:2px; }
.offline-map { overflow:hidden; }
.off-marker {
  position:absolute; transform:translate(-50%,-50%);
  background:none; border:none; cursor:pointer; padding:0;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.off-dot {
  width:14px; height:14px; border-radius:50%;
  background:#FFFFFF; border:2px solid var(--primary);
  box-shadow:0 0 0 2px rgba(251,247,240,.7);
  transition:all .3s ease-out;
}
.off-dot { background:var(--primary); transform:scale(1.2); }
.off-dot { outline:2px solid var(--accent); outline-offset:2px; }
.off-label {
  font-size:11px; color:var(--ink); background:rgba(251,247,240,.85);
  padding:1px 5px; border-radius:3px; white-space:nowrap;
  font-weight:600;
}
.off-label { color:var(--primary-deep); }
/* ===== 无障碍 ===== */
@media (prefers-reduced-motion: reduce) {
  * { animation:none !important; transition:none !important; }
}
</style>
</head>

/* ===== 全局 state ===== */
const state = {
  currentIndex: 0,   // 0-6
  grade: '大学',
  tab: 'event',      // event | theory | history

/* ===== 学段切换（I4） ===== */
function setGrade(g) {
  state.grade = g;
  document.querySelector('.app').setAttribute('data-grade', g);

    b.classList.toggle('active', b.dataset.grade === g);
  });

  if (!document.getElementById('stepper-view-detail').hidden) renderDetail();

/* ===== 工具 ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);

const PHASE_CHIP = { practice:'实践', recognition:'认识', repractice:'再实践' };

/* ===== 渲染：时间轴（I1） ===== */
function renderTimeline() {
  const tl = $('#timeline');
  tl.innerHTML = '';
  DATA.points.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tl__node' + (i === state.currentIndex ? ' active' : '');
    btn.setAttribute('aria-label', '节点' + (i+1) + ' ' + p.title);
    btn.innerHTML = `<span class="tl__dot"></span><span class="tl__year">${esc(p.year)}</span>`;
    btn.addEventListener('click', () => openDetail(i));
    tl.appendChild(btn);
  });
}

/* ===== 渲染：左栏 stepper ===== */
function renderStepper() {
  const list = $('#stepper-list');
  list.innerHTML = '';
  DATA.points.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'stepper__node' + (i === state.currentIndex ? ' active' : '');
    btn.innerHTML = `<span class="dot"></span><span><span class="label">${esc(p.title)}</span><br><span class="phase">${esc(p.phase_set)}</span></span>`;
    btn.addEventListener('click', () => openDetail(i));
    list.appendChild(btn);
  });
}

/* ===== 选择节点（全同步：时间轴/stepper/弹层） ===== */
function selectNode(i) {
  state.currentIndex = i;
  renderTimeline();
  renderStepper();
  applyChannel(i);  // 渠线演进（在线/离线）
}


/* ===== Phase 3 地图模块：在线天地图 + 离线 SVG + 双重判定降级 ===== */
let mapInstance = null;
let mapMarkers = [];
let mapLine = null;
let mapMode = 'loading';   // loading | online | svg

/* 渠线 Polyline：7 节点 geo 连线 */
/* 在线天地图初始化 */
function initOnlineMap() {
  const center = DATA.map.center;
  const vecUrl = 'https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + DATA.map.key;
  const map = new T.Map('tianditu', {
    center: new T.LngLat(center[1], center[0]),  // map.center 为 [lat,lng]，转序
    zoom: DATA.map.zoom,
    layers: [new T.TileLayer(vecUrl)]            // 矢量底图（显式 url 模板）
  });
  mapInstance = map;
  mapMode = 'online';
  // Marker（白描边）+ Polyline
  mapMarkers = DATA.points.map((p, i) => {
    const m = new T.Marker(new T.LngLat(p.geo.lng, p.geo.lat), { icon: markerIcon(i) });
    m.on('click', () => openDetail(i));
    map.addOverLay(m);
    return m;
  });
  highlightMapNode(state.currentIndex);
}

/* Marker 图标：白描边红点 */
function markerIcon(i) {
  const active = i === state.currentIndex;
  const p = DATA.points[i];
  // 圆点 + 名称标签（放大时可见）
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="90" height="30">
    <circle cx="9" cy="15" r="7" fill="${active?'#C81623':'#FFFFFF'}" stroke="#FFFFFF" stroke-width="2"/>
    <text x="20" y="19" font-size="12" font-family="'Microsoft YaHei',sans-serif" fill="${active?'#8E0F18':'#2B2B2B'}" stroke="#FBF7F0" stroke-width="3" paint-order="stroke">${p.title}</text>
  </svg>`;
  return new T.Icon({
    iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg),
    iconSize: new T.Point(90, 30),
    iconAnchor: new T.Point(9, 15)
  });
}

/* 地图联动：高亮当前节点 Marker + panTo 居中（3b） */
function highlightMapNode(i) {
  if (!mapInstance || mapMode !== 'online') return;
  const p = DATA.points[i];
  mapMarkers.forEach((m, idx) => m.setIcon(markerIcon(idx)));
  // 点击聚焦：setView 直接居中到当前节点（确定生效）
  mapInstance.setView(new T.LngLat(p.geo.lng, p.geo.lat), Math.max(mapInstance.getZoom(), 11));
}


/* 地理坐标 → SVG 平面投影（简化，仅示意渠线走向） */
function projXY(lng, lat) {
  const bounds = { lngMin: 113.74, lngMax: 113.84, latMin: 36.19, latMax: 36.37 };
  const x = (lng - bounds.lngMin) / (bounds.lngMax - bounds.lngMin) * 360 + 20;
  const y = (bounds.latMax - lat) / (bounds.latMax - bounds.latMin) * 260 + 20;
  return { x, y };
}

/* 双重判定降级（3c）：对象失败立即降级；创建成功但 5s 无瓦片也降级 */
function initMap() {
  mapMode = 'loading';
  try {
    if (typeof T === 'undefined' || !T.Map) throw new Error('天地图API未加载');
    initOnlineMap();
    // 5s 后检查瓦片是否铺上
    setTimeout(() => {
      // 检测地图瓦片容器内的真实瓦片（排除 logo 等非瓦片 img）
      const tilePane = document.querySelector('#tianditu .tdt-tile-pane');
      // 只数"真正加载成功"的瓦片（complete 且 naturalWidth>0），abort/失败残留的 img 不算
      const tileCount = tilePane ? Array.from(tilePane.querySelectorAll('img')).filter(i => i.complete && i.naturalWidth > 0).length : 0;
      if (mapMode === 'online' && tileCount === 0) {
        console.warn('天地图 5s 无瓦片，降级离线 SVG');
        buildOfflineSvg();
      }
    }, 5000);
  } catch (e) {
    console.warn('天地图初始化失败，降级离线 SVG:', e.message);
    buildOfflineSvg();
  }
}

/* ===== 详情弹层（I2 单弹层 + 三 Tab） ===== */
/* 渠线演进（在线/离线） */
let offFocus = null;  // 离线聚焦状态

function buildOfflineSvg() {
  const stage = document.querySelector('#tianditu');
  if (mapInstance) { try { mapInstance.clearOverLays(); } catch(e){} mapInstance = null; }
  mapMarkers = []; mapLine = null;
  stage.innerHTML = '';
  mapMode = 'svg';
  // 底图容器（可缩放聚焦）
  const box = document.createElement('div');
  box.className = 'offline-map';
  box.id = 'offline-map';
  box.style.backgroundImage = 'url(data:image/png;base64,' + OFFLINE.base64 + ')';
  box.style.backgroundSize = '100% 100%';  // 拉伸铺满容器，Marker 百分比精确对齐
  box.style.backgroundPosition = 'center';
  box.style.backgroundRepeat = 'no-repeat';
  box.style.position = 'absolute'; box.style.inset = '0';
  box.style.transition = 'transform .4s ease-out';
  stage.appendChild(box);
  // 节点 Marker 叠加
  OFFLINE.nodes.forEach((n) => {
    const mk = document.createElement('button');
    mk.className = 'off-marker' + (n.id-1 === state.currentIndex ? ' active' : '');
    mk.style.left = (n.px / OFFLINE.width * 100) + '%';
    mk.style.top = (n.py / OFFLINE.height * 100) + '%';
    mk.setAttribute('aria-label', n.title);
    mk.innerHTML = '<span class="off-dot"></span><span class="off-label">' + n.title + '</span>';
    mk.addEventListener('click', () => { openDetail(n.id-1); focusOffline(n); });
    box.appendChild(mk);
  });
  svgEl = box;
}

/* 离线点击聚焦：放大底图到该节点区域 */
function focusOffline(n) {
  const box = document.getElementById('offline-map');
  if (!box) return;
  const nx = n.px / OFFLINE.width, ny = n.py / OFFLINE.height;
  const scale = 2.2;
  // 以节点为缩放中心（transform-origin 指向节点百分比位置）
  box.style.transformOrigin = (nx * 100) + '% ' + (ny * 100) + '%';
  box.style.transform = 'scale(' + scale + ')';
  offFocus = n.id - 1;
  // 高亮当前 Marker
  document.querySelectorAll('.off-marker').forEach((m, i) => {
    m.classList.toggle('active', i === state.currentIndex);
  });
}

function applyChannel(i) {
  if (mapMode === 'online') highlightMapNode(i);       // 在线：Marker高亮+panTo+渠线演进
  else if (mapMode === 'svg') { buildOfflineSvg(); if (offFocus !== null) focusOffline(OFFLINE.nodes[state.currentIndex]); }  // 离线：底图+聚焦
}

function openDetail(i) {
  state.currentIndex = i;
  state.tab = 'event';
  renderTimeline(); renderStepper(); applyChannel(i); renderDetail();
  // 左栏覆盖详情层：隐藏列表，显示详情
  $('#stepper-view-list').hidden = true;
  $('#stepper-view-detail').hidden = false;
  $('#detail-close').focus();
  showImgPop(i);  // 图片小弹窗
}

/* 节点图片小弹窗（占位，待定图后填） */
function showImgPop(i) {
  const p = DATA.points[i];
  const pop = document.getElementById('img-pop');
  document.getElementById('img-pop-title').textContent = p.title;
  const frame = document.getElementById('img-pop-frame');
  // 占位：等提供图后改为 <img src='...'>
  frame.innerHTML = '<span>图片待定 · ' + p.title + '</span>';
  pop.classList.add('open');
}
function closeImgPop() {
  document.getElementById('img-pop').classList.remove('open');
}

function closeDetail() {
  // x 返回：显示列表，隐藏详情
  $('#stepper-view-detail').hidden = true;
  $('#stepper-view-list').hidden = false;
  closeImgPop();  // 图片弹窗也关
  // 复位离线地图缩放（回到初始未放大状态）
  const om = document.getElementById('offline-map');
  if (om) { om.style.transform = 'none'; om.style.transformOrigin = 'center center'; }
  offFocus = null;
  // 焦点返回时间轴当前节点
  $('#timeline .tl__node.active')?.focus();
}

function renderTabs() {
  const tabs = $('#detail-tabs');
  tabs.innerHTML = '';
  // 小学档隐藏两个溯源 Tab（theme_token §6：极简，藏溯源层）
  const isPrimary = state.grade === '小学';
  const defs = [['event','事件详情'],['theory','理论溯源'],['history','史实溯源']]
    .filter(([k]) => !(isPrimary && k !== 'event'));
  defs.forEach(([key,label]) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', state.tab === key);
    b.textContent = label;
    b.addEventListener('click', () => { state.tab = key; renderTabs(); renderDetail(); });
    tabs.appendChild(b);
  });
}

/* ===== 渲染详情正文（含 node7 谱系遍历） ===== */
function renderDetail() {
  const p = DATA.points[state.currentIndex];
  const body = $('#detail-body');
  $('#detail-title').textContent = (state.currentIndex+1) + '. ' + p.title;
  $('#detail-meta').textContent = p.year + ' ｜ ' + p.phase_set + ' ｜ 学段：' + state.grade;
  renderTabs();

  let h = '';
  if (state.tab === 'event') {
    // 学段切换：事件详情正文按 grade 字段换文本（theme_token §6）
    if (state.grade === '小学') {
      h += `<div class="block"><p>${esc(p.grade && p.grade['小学'] || p.practice)}</p></div>`;
    } else {
      h += `<div class="block"><h4><span class="practice-chip">实践</span></h4><p>${esc(p.grade && p.grade[state.grade] || p.practice)}</p></div>`;
      h += `<div class="block"><h4><span class="cognition-chip">认识</span></h4><p>${esc(p.recognition)}</p></div>`;
      h += `<div class="block"><h4><span class="repractice-chip">再实践</span></h4><p>${esc(p.repractice)}</p></div>`;
      h += `<div class="block"><p class="keydata">关键数据：${esc(p.key_data)}</p></div>`;
    }
  } else if (state.tab === 'theory') {
    // node7 谱系：检测 anch_auxiliary / anch_contemporary
    const anc = p.anch || {};
    h += `<div class="block"><h4>毛选理论溯源</h4>`;
    h += `<div class="anch-src">${esc(anc.src)} ｜ ${esc(anc.vol)} ｜ 第 ${esc(anc.page)} 页</div>`;
    h += `<div class="anch-excerpt">“${esc(anc.excerpt)}”</div>`;
    h += `<div class="anch-edition">版次：${esc(anc.edition || '待核')}</div>`;
    h += `</div>`;
    // 辅助锚点（node7 有）
    if (p.anch_auxiliary && p.anch_auxiliary.length) {
      h += `<div class="block"><h4>辅助锚点</h4>`;
      p.anch_auxiliary.forEach(a => {
        h += `<div class="aux-block"><h5>${esc(a.src)}</h5><div class="anch-src">${esc(a.vol)} ｜ 第 ${esc(a.page)} 页</div><div class="anch-excerpt">“${esc(a.excerpt)}”</div></div>`;
      });
      h += `</div>`;
    }
    // 当代印证（node7 有）
    if (p.anch_contemporary) {
      const c = p.anch_contemporary;
      h += `<div class="block"><h4>当代印证</h4><div class="contemp-block"><h5>${esc(c.src)}</h5><p>${esc(c.excerpt)}</p><div class="note-mark">※ ${esc(c.note || '非《毛选》原文')}</div></div></div>`;
    }
  } else if (state.tab === 'history') {
    h += `<div class="block"><h4>史实溯源（新闻报道）</h4>`;
    (p.source || []).forEach(s => {
      h += `<div class="block"><div>${esc(s.title)}</div><a class="src-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>`;
    });
    h += `</div>`;
  }
  body.innerHTML = h;
}

/* ===== 键盘导航（←/→ 切节点） ===== */
document.addEventListener('keydown', (e) => {
  const detailOpen = !document.getElementById('stepper-view-detail').hidden;
  if (e.key === 'ArrowRight') { openDetail(Math.min(state.currentIndex+1, 6)); }
  else if (e.key === 'ArrowLeft') { openDetail(Math.max(state.currentIndex-1, 0)); }
  else if ((e.key === 'x' || e.key === 'X' || e.key === 'Escape') && detailOpen) { closeDetail(); }
});

/* ===== 初始化 ===== */
$('#detail-close').addEventListener('click', closeDetail);
$('#img-pop-close').addEventListener('click', closeImgPop);
document.querySelectorAll('.grade-btn').forEach(b => {
  b.addEventListener('click', () => setGrade(b.dataset.grade));
});
// 延迟到天地图 API 完全就绪再初始化（避免 extend 时序错误）
setTimeout(() => {
  if (typeof T !== 'undefined' && T.Map) initMap();
  else { console.warn('天地图API未就绪，直接降级离线SVG'); buildOfflineSvg(); }
}, 300);
renderTimeline(); renderStepper();
window.__SKELETON_READY__ = DATA.points.length === 7;
</script>
</body>
</html>
